<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — GM VENTAS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../public/css/purple-theme.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3" style="background: radial-gradient(circle at top right, #f3e8ff 0%, #faf7ff 50%, #ede9fe 100%);">
  <main class="w-100" style="max-width: 440px;">
    <section class="gm-card overflow-hidden">
      <div class="p-4 text-white" style="background: linear-gradient(125deg, #5b21b6 0%, #7c3aed 100%);">
        <div class="d-flex align-items-center gap-2 mb-1">
          <i class="bi bi-stars fs-4"></i>
          <h1 class="h4 fw-bold mb-0">GM VENTAS</h1>
        </div>
        <p class="small mb-0 opacity-75">Gestión de Inventario y Punto de Venta · Salón de Belleza</p>
      </div>

      <div class="p-4">
        <div id="loginAlert" class="alert alert-danger d-none py-2 small" role="alert"></div>

        <form id="frmAcceso" method="post">
          <div class="mb-3">
            <label for="logina" class="form-label small fw-bold text-secondary">Usuario</label>
            <input type="text" id="logina" name="logina" class="form-control" placeholder="Ingresa tu usuario" required>
          </div>
          <div class="mb-3">
            <label for="clavea" class="form-label small fw-bold text-secondary">Contraseña</label>
            <input type="password" id="clavea" name="clavea" class="form-control" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-gm w-100 py-2">
            <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar al Sistema
          </button>
        </form>
      </div>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="scripts/login.js"></script>
</body>
</html>
